<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Playground Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-purple: #818cf8;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }

    header { background: #1e293b; padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.25rem; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .app-container { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    sidebar { width: 300px; background: #0f172a; border-right: 1px solid var(--border-color); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .sidebar-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    
    .table-badge { background: #1e293b; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 8px; font-family: monospace; color: var(--accent-blue); display: flex; justify-content: space-between; }
    
    .btn-small { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--accent-blue); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
    .btn-small:hover { background: var(--accent-blue); color: #0f172a; }

    .challenge-card { background: #1e293b; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
    .challenge-card:hover { border-color: var(--accent-blue); }
    .challenge-card.active { border-color: var(--accent-purple); background: #26334d; }
    .challenge-title { font-size: 0.85rem; font-weight: bold; color: var(--accent-blue); }
    .challenge-desc { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

    /* Main Area */
    main { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 16px; overflow-y: auto; }

    .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
    .tab-btn { background: transparent; color: var(--text-muted); border: none; padding: 8px 16px; cursor: pointer; font-weight: bold; border-radius: 6px; }
    .tab-btn.active { background: var(--card-bg); color: var(--accent-blue); border: 1px solid var(--border-color); }

    .tab-content { display: none; flex-direction: column; gap: 16px; flex: 1; }
    .tab-content.active { display: flex; }

    .editor-wrapper { position: relative; }
    textarea { width: 100%; height: 120px; background: #1e293b; color: #38bdf8; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; font-family: 'Fira Code', monospace; font-size: 0.95rem; outline: none; resize: vertical; }

    .actions-bar { display: flex; gap: 12px; align-items: center; }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #4f46e5); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-secondary { background: #1e293b; color: var(--accent-purple); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-secondary:hover { border-color: var(--accent-purple); }

    .results-card { background: #1e293b; border-radius: 8px; border: 1px solid var(--border-color); padding: 16px; min-height: 200px; flex: 1; overflow-x: auto; }
    .status-bar { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th { background: #0f172a; color: var(--accent-blue); text-align: left; padding: 10px; border-bottom: 2px solid var(--border-color); font-size: 0.9rem; }
    td { padding: 10px; border-bottom: 1px solid var(--border-color); color: var(--text-main); font-size: 0.9rem; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; width: 450px; max-width: 90%; }
    .modal-title { font-size: 1.1rem; color: var(--accent-blue); margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 8px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 4px; }
    .column-row { display: flex; gap: 8px; margin-bottom: 8px; }

    .diagram-container { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); overflow: auto; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>SQL Playground Pro</h1>
    <span style="color: var(--text-muted); font-size: 0.85rem;">Engine: SQLite (WebAssembly)</span>
  </header>

  <div class="app-container">
    <sidebar>
      <div>
        <div class="sidebar-title">
          Database Schema
          <button class="btn-small" onclick="openCreateTableModal()">+ New Table</button>
        </div>
        <div id="schemaList">Loading...</div>
      </div>
      <div>
        <div class="sidebar-title">Challenges</div>
        <div id="challengeList"></div>
      </div>
    </sidebar>

    <main>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('editor')">SQL Editor</button>
        <button class="tab-btn" onclick="switchTab('er')">ER Diagram</button>
      </div>

      <!-- Tab 1: Editor -->
      <div id="tab-editor" class="tab-content active">
        <div class="editor-wrapper">
          <textarea id="queryInput" placeholder="Write your SQL query here..."></textarea>
        </div>

        <div class="actions-bar">
          <button class="btn-primary" id="runBtn">Run Query ▶</button>
          <button class="btn-secondary" id="explainBtn">Explain Query Plan 🔍</button>
          <button class="btn-secondary" id="checkBtn">Check Answer ✔</button>
        </div>

        <div class="results-card">
          <div id="validationBox" style="display:none; padding:8px; margin-bottom:8px; border-radius:4px;"></div>
          <div class="status-bar" id="statusBar">Ready.</div>
          <div id="tableOutput"></div>
        </div>
      </div>

      <!-- Tab 2: ER Diagram -->
      <div id="tab-er" class="tab-content">
        <div class="diagram-container">
          <div class="mermaid" id="mermaidDiagram">
            erDiagram
              LOADING...
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Table Builder Modal -->
  <div class="modal-overlay" id="tableModal">
    <div class="modal">
      <div class="modal-title">Visual Table Creator</div>
      <div class="form-group">
        <label>Table Name</label>
        <input type="text" id="modalTableName" placeholder="e.g. orders">
      </div>
      <div id="columnsContainer">
        <div class="column-row">
          <input type="text" placeholder="Column Name (e.g. id)" class="col-name">
          <select class="col-type">
            <option value="INTEGER PRIMARY KEY">INT PK</option>
            <option value="TEXT">TEXT</option>
            <option value="REAL">REAL</option>
          </select>
        </div>
      </div>
      <button class="btn-small" onclick="addColumnRow()" style="margin-bottom:16px;">+ Add Column</button>
      <div style="display:flex; justify-end:flex-end; gap:8px;">
        <button class="btn-secondary" onclick="closeCreateTableModal()">Cancel</button>
        <button class="btn-primary" onclick="submitCreateTable()">Create Table</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
