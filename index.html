<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Playground Pro</title>

  <!-- CodeMirror for Request/Response Editing -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }

    header { background: #1e293b; padding: 12px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.25rem; background: linear-gradient(135deg, var(--accent-blue), #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .app-container { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    sidebar { width: 260px; background: #0f172a; border-right: 1px solid var(--border-color); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .sidebar-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
    .preset-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 10px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 0.85rem; width: 100%; margin-bottom: 6px; transition: all 0.2s; }
    .preset-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

    /* Main Content */
    main { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 16px; overflow-y: auto; }

    /* URL & Method Bar */
    .url-bar { display: flex; gap: 10px; }
    .method-select { background: #1e293b; color: var(--accent-blue); font-weight: bold; border: 1px solid var(--border-color); border-radius: 6px; padding: 0 12px; outline: none; }
    .url-input { flex: 1; background: #1e293b; border: 1px solid var(--border-color); color: #fff; padding: 10px 14px; border-radius: 6px; font-size: 0.95rem; outline: none; }
    .send-btn { background: linear-gradient(135deg, #0284c7, #4f46e5); color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* Section Split */
    .pane-container { display: flex; gap: 16px; flex: 1; min-height: 0; }
    .pane { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }

    .pane-header { font-size: 0.9rem; font-weight: bold; color: var(--accent-blue); display: flex; justify-content: space-between; align-items: center; }
    .status-badge { font-size: 0.8rem; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    .status-badge.success { background: rgba(74, 222, 128, 0.2); color: var(--accent-green); }
    .status-badge.error { background: rgba(248, 113, 113, 0.2); color: var(--accent-red); }

    .key-value-row { display: flex; gap: 8px; margin-bottom: 6px; }
    .key-value-row input { background: #0f172a; border: 1px solid var(--border-color); color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 0.85rem; flex: 1; }

    .CodeMirror { flex: 1; border-radius: 6px; border: 1px solid var(--border-color); font-family: monospace; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <h1>REST API Playground</h1>
  </header>

  <div class="app-container">
    <sidebar>
      <div class="sidebar-title">Preset Public APIs</div>
      <button class="preset-btn" onclick="loadPreset('GET', 'https://jsonplaceholder.typicode.com/posts/1')">GET Single Post</button>
      <button class="preset-btn" onclick="loadPreset('GET', 'https://jsonplaceholder.typicode.com/comments?postId=1')">GET Comments</button>
      <button class="preset-btn" onclick="loadPreset('POST', 'https://jsonplaceholder.typicode.com/posts', '{\n  \"title\": \"foo\",\n  \"body\": \"bar\",\n  \"userId\": 1\n}')">POST Create Item</button>
    </sidebar>

    <main>
      <div class="url-bar">
        <select id="httpMethod" class="method-select">
          <option value="GET">GET</option>
          <option value="POST">POST</option>
          <option value="PUT">PUT</option>
          <option value="DELETE">DELETE</option>
        </select>
        <input type="text" id="apiUrl" class="url-input" value="https://jsonplaceholder.typicode.com/posts/1">
        <button class="send-btn" onclick="sendRequest()">Send ▶</button>
      </div>

      <div class="pane-container">
        <!-- Request Config Pane -->
        <div class="pane">
          <div class="pane-header">Headers & Request Body</div>
          <div id="headersContainer">
            <div class="key-value-row">
              <input type="text" placeholder="Header Key (e.g. Content-Type)" class="header-key" value="Content-Type">
              <input type="text" placeholder="Header Value" class="header-val" value="application/json">
            </div>
          </div>
          <div style="flex:1; display:flex; flex-direction:column;">
            <label style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px;">JSON Payload (for POST/PUT)</label>
            <textarea id="requestBody">{\n  "title": "foo",\n  "body": "bar",\n  "userId": 1\n}</textarea>
          </div>
        </div>

        <!-- Response Pane -->
        <div class="pane">
          <div class="pane-header">
            Response
            <span id="statusBadge" class="status-badge" style="display:none;"></span>
          </div>
          <textarea id="responseBody"></textarea>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
