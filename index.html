<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL.js Sandbox</title>
  <!-- Load sql.js library from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    textarea { width: 100%; height: 80px; font-family: monospace; }
    button { margin-top: 10px; padding: 8px 16px; cursor: pointer; }
    table, th, td { border: 1px solid #ccc; border-collapse: collapse; padding: 8px; }
    table { margin-top: 15px; width: 100%; }
  </style>
</head>
<body>

  <h2>In-Browser SQL Playground</h2>
  
  <label for="queryInput">Write SQL Query:</label>
  <textarea id="queryInput">SELECT * FROM users;</textarea>
  <br>
  <button id="runBtn">Run Query</button>

  <h3>Results</h3>
  <div id="output">Initialize database...</div>

  <script src="app.js"></script>
</body>
</html>
