<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Playground Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-purple: #818cf8;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }

    header { background: #1e293b; padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.25rem; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .app-container { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    sidebar { width: 280px; background: #0f172a; border-right: 1px solid var(--border-color); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .sidebar-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px; }
    .table-badge { background: #1e293b; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 8px; font-family: monospace; color: var(--accent-blue); }

    .challenge-card { background: #1e293b; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
    .challenge-card:hover { border-color: var(--accent-blue); }
    .challenge-card.active { border-color: var(--accent-purple); background: #26334d; }
    .challenge-title { font-size: 0.85rem; font-weight: bold; color: var(--accent-blue); }
    .challenge-desc { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

    /* Main Content */
    main { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 16px; overflow-y: auto; }

    .editor-wrapper { position: relative; }
    textarea { width: 100%; height: 120px; background: #1e293b; color: #38bdf8; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; font-family: 'Fira Code', monospace; font-size: 0.95rem; outline: none; resize: vertical; }
    textarea:focus { border-color: var(--accent-blue); box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }

    .actions-bar { display: flex; gap: 12px; align-items: center; }
    .btn-run { background: linear-gradient(135deg, #0284c7, #4f46e5); color: white; border: none; padding: 10px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
    .btn-run:active { transform: scale(0.98); }
    .btn-check { background: linear-gradient(135deg, #059669, #10b981); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* Banner & Results */
    .challenge-banner { background: #1e293b; border-left: 4px solid var(--accent-purple); padding: 12px 16px; border-radius: 4px; font-size: 0.9rem; }
    .results-card { background: #1e293b; border-radius: 8px; border: 1px solid var(--border-color); padding: 16px; min-height: 200px; flex: 1; overflow-x: auto; }
    .status-bar { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
    .validation-msg { padding: 8px 12px; border-radius: 6px; font-weight: bold; margin-bottom: 12px; display: none; }
    .validation-success { background: rgba(74, 222, 128, 0.1); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .validation-error { background: rgba(248, 113, 113, 0.1); color: var(--accent-red); border: 1px solid var(--accent-red); }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th { background: #0f172a; color: var(--accent-blue); text-align: left; padding: 10px; border-bottom: 2px solid var(--border-color); font-size: 0.9rem; }
    td { padding: 10px; border-bottom: 1px solid var(--border-color); color: var(--text-main); font-size: 0.9rem; }
    tr:hover { background: rgba(255, 255, 255, 0.03); }
  </style>
</head>
<body>

  <header>
    <h1>SQL Playground Pro</h1>
    <span style="color: var(--text-muted); font-size: 0.85rem;">Engine: SQLite (WebAssembly)</span>
  </header>

  <div class="app-container">
    <sidebar>
      <div>
        <div class="sidebar-title">Practice Challenges</div>
        <div id="challengeList"></div>
      </div>
      <div>
        <div class="sidebar-title">Database Schema</div>
        <div id="schemaList">Loading tables...</div>
      </div>
    </sidebar>

    <main>
      <div class="challenge-banner" id="challengeBanner">
        Select a challenge from the sidebar to test your SQL knowledge!
      </div>

      <div class="editor-wrapper">
        <textarea id="queryInput" placeholder="Write your SQL query here..."></textarea>
      </div>

      <div class="actions-bar">
        <button class="btn-run" id="runBtn">Run Query ▶</button>
        <button class="btn-check" id="checkBtn">Submit & Check Answer ✔</button>
      </div>

      <div class="results-card">
        <div id="validationBox" class="validation-msg"></div>
        <div class="status-bar" id="statusBar">Initializing database...</div>
        <div id="tableOutput"></div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
